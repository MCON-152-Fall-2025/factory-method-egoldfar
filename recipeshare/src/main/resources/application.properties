spring.application.name=recipeshare
server.port=8082

# H2 + JPA
# Use a file-based H2 DB and enable AUTO_SERVER so the console can connect reliably
spring.datasource.url=jdbc:h2:file:./data/recipeshare;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=1234
# JPA / Hibernate settings
## H2 dialect is auto-detected, so this line is optional
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable H2 console and allow web access from other hosts if needed
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================

# 3.1 Configure Log Levels
# Root logger at INFO level
logging.level.root=INFO
# Web layer at DEBUG to capture detailed request traces
logging.level.com.mcon152.recipeshare.web=DEBUG
# Spring web internals at INFO (avoid flooding console)
logging.level.org.springframework.web=INFO

# 3.2 Configure Console Log Pattern
# Pattern includes: time, thread, colored level, logger, and pink-colored message
# %clr adds color; {magenta} makes the message pink
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %clr(%-5level){faint} %logger{36} - %clr(%msg){magenta}%n

# 3.3 Configure Rolling File Appender
# Base log file location
logging.file.name=logs/recipeshare.log

# Rolling policy configuration
# Archive pattern with date and index, compressed with gzip
logging.logback.rollingpolicy.file-name-pattern=logs/recipeshare-%d{yyyy-MM-dd}.%i.log.gz
# Maximum size of a single log file (set small to see rolling in action)
logging.logback.rollingpolicy.max-file-size=50KB
# Keep log archives for 7 days
logging.logback.rollingpolicy.max-history=7
# Maximum total size of all archived log files
logging.logback.rollingpolicy.total-size-cap=1GB
# Clean old log files on application startup
logging.logback.rollingpolicy.clean-history-on-start=true
